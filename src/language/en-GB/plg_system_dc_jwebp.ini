PLG_SYSTEM_DC_JWEBP_FIELD_SETTINGS_LABEL="Settings"
PLG_SYSTEM_DC_JWEBP_FIELD_QUALITY_LABEL="WebP Quality"
PLG_SYSTEM_DC_JWEBP_FIELD_QUALITY_DESC="WebP compression quality for JPEG images (0–100). Default is 85. PNG images are saved lossless."
PLG_SYSTEM_DC_JWEBP_FIELD_UPLOAD_MODE_LABEL="Conversion on Upload"
PLG_SYSTEM_DC_JWEBP_FIELD_UPLOAD_MODE_DESC="Converts JPG/PNG files uploaded in the media manager right away. \"Add WebP\" keeps the original and writes a WebP copy next to it. \"WebP only\" stores only the WebP file (if it is smaller), and the media manager inserts it directly; the original is not kept. Files uploaded by FTP are still converted when a page is viewed."
PLG_SYSTEM_DC_JWEBP_FIELD_EXCLUDE_LABEL="Excluded Paths"
PLG_SYSTEM_DC_JWEBP_FIELD_EXCLUDE_DESC="One folder per line, relative to the Joomla root (e.g. images/headers). Images in these folders and their subfolders will not be converted."
PLG_SYSTEM_DC_JWEBP_FIELD_LAZYLOAD_LABEL="Lazy Loading"
PLG_SYSTEM_DC_JWEBP_FIELD_LAZYLOAD_DESC="Enable or disable automatic lazy loading for images."
PLG_SYSTEM_DC_JWEBP_FIELD_MAX_PER_REQUEST_LABEL="Max. Conversions per Request"
PLG_SYSTEM_DC_JWEBP_FIELD_MAX_PER_REQUEST_DESC="How many images may be converted while one page is loading. The remaining images are converted on the next page views."
PLG_SYSTEM_DC_JWEBP_FIELD_LAZY_SKIP_LABEL="Images without Lazy Loading"
PLG_SYSTEM_DC_JWEBP_FIELD_LAZY_SKIP_DESC="Number of images at the top of the page (logo, hero image) that load immediately. Images with a fetchpriority attribute always load immediately."

PLG_SYSTEM_DC_JWEBP_OPTION_ENABLED="Enabled"
PLG_SYSTEM_DC_JWEBP_OPTION_DISABLED="Disabled"
PLG_SYSTEM_DC_JWEBP_OPTION_UPLOAD_OFF="Off"
PLG_SYSTEM_DC_JWEBP_OPTION_UPLOAD_ADD="Add WebP"
PLG_SYSTEM_DC_JWEBP_OPTION_UPLOAD_REPLACE="WebP only"
