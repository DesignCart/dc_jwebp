PLG_SYSTEM_DC_JWEBP_FIELD_SETTINGS_LABEL="Einstellungen"
PLG_SYSTEM_DC_JWEBP_FIELD_QUALITY_LABEL="WebP-Qualität"
PLG_SYSTEM_DC_JWEBP_FIELD_QUALITY_DESC="Kompressionsqualität für WebP bei JPEG-Bildern (0–100). Standard ist 85. PNG-Bilder werden verlustfrei gespeichert."
PLG_SYSTEM_DC_JWEBP_FIELD_UPLOAD_MODE_LABEL="Konvertierung beim Upload"
PLG_SYSTEM_DC_JWEBP_FIELD_UPLOAD_MODE_DESC="Konvertiert JPG/PNG-Dateien sofort beim Hochladen im Medienmanager. \"WebP zusätzlich\" behält das Original und legt eine WebP-Kopie daneben. \"Nur WebP\" speichert nur die WebP-Datei (wenn sie kleiner ist), und der Medienmanager fügt sie direkt ein; das Original wird nicht behalten. Per FTP hochgeladene Dateien werden weiterhin beim Seitenaufruf konvertiert."
PLG_SYSTEM_DC_JWEBP_FIELD_EXCLUDE_LABEL="Ausgeschlossene Pfade"
PLG_SYSTEM_DC_JWEBP_FIELD_EXCLUDE_DESC="Ein Ordner pro Zeile, relativ zum Joomla-Hauptverzeichnis (z. B. images/headers). Bilder in diesen Ordnern und ihren Unterordnern werden nicht konvertiert."
PLG_SYSTEM_DC_JWEBP_FIELD_LAZYLOAD_LABEL="Lazy Loading"
PLG_SYSTEM_DC_JWEBP_FIELD_LAZYLOAD_DESC="Aktiviert oder deaktiviert das automatische Lazy Loading für Bilder."
PLG_SYSTEM_DC_JWEBP_FIELD_MAX_PER_REQUEST_LABEL="Max. Konvertierungen pro Seitenaufruf"
PLG_SYSTEM_DC_JWEBP_FIELD_MAX_PER_REQUEST_DESC="Wie viele Bilder beim Laden einer Seite konvertiert werden dürfen. Die übrigen Bilder werden bei den nächsten Seitenaufrufen konvertiert."
PLG_SYSTEM_DC_JWEBP_FIELD_LAZY_SKIP_LABEL="Bilder ohne Lazy Loading"
PLG_SYSTEM_DC_JWEBP_FIELD_LAZY_SKIP_DESC="Anzahl der Bilder am Seitenanfang (Logo, Titelbild), die sofort geladen werden. Bilder mit dem Attribut fetchpriority werden immer sofort geladen."

PLG_SYSTEM_DC_JWEBP_OPTION_ENABLED="Aktiviert"
PLG_SYSTEM_DC_JWEBP_OPTION_DISABLED="Deaktiviert"
PLG_SYSTEM_DC_JWEBP_OPTION_UPLOAD_OFF="Aus"
PLG_SYSTEM_DC_JWEBP_OPTION_UPLOAD_ADD="WebP zusätzlich"
PLG_SYSTEM_DC_JWEBP_OPTION_UPLOAD_REPLACE="Nur WebP"
